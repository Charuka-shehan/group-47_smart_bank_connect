# SmartBank Connect - Group 47 - SE2030
spring.application.name=smartbank-connect

# ---------- Server ----------
server.port=8080
server.servlet.context-path=/

# ---------- View resolver (JSP) ----------
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ---------- MySQL Datasource ----------
spring.datasource.url=jdbc:mysql://localhost:3306/smartbank_connect?useSSL=false&serverTimezone=Asia/Colombo&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=2002
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- HikariCP connection pool ----------
spring.datasource.hikari.pool-name=SmartBankHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---------- Mail (simulated / sandbox per proposal Section 9 - Budget) ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=charukashehanrs@gmail.com
spring.mail.password=xokyszzpwzqffkil
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Google Sign-In / Sign-Up (OAuth 2.0) ----------
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.provider.google.user-name-attribute=email

# ---------- Logging ----------
logging.level.com.lankatrust.smartbank=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# ---------- Multipart (document uploads for accounts/loans) ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ---------- Session Settings ----------
server.servlet.session.timeout=15m

# ---------- Security ----------
security.login.maxFailedAttempts=5
security.login.lockDurationMinutes=30